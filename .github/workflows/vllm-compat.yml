# Does this package still hold against the vLLM that shipped today?
#
# vLLM guarantees one thing for out-of-tree code: ModelRegistry.register_model
# keeps working. Everything in compat/seams.py is borrowed, not owed, so the
# useful question is not "did it break" but "which name moved, and when".
#
# Asked the cheap way -- a shallow clone and the static seam checker. No install,
# no CUDA wheels, no GPU, because check_all_static parses the tree instead of
# importing it.
name: vllm-compat

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  seams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the offline half
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Resolve vLLM's latest release
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref=$(gh api repos/vllm-project/vllm/releases/latest --jq .tag_name)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "checking against vLLM $ref"

      - name: Check the seams against it
        id: check
        continue-on-error: true
        run: |
          git clone --depth 1 --branch "${{ steps.ref.outputs.ref }}" \
            https://github.com/vllm-project/vllm.git /tmp/vllm
          surgeon seams --source /tmp/vllm | tee /tmp/seams.txt

      - name: Open an issue naming the seam that moved
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          # A broken seam is news, not an emergency: the pinned version still
          # works. One issue per upstream ref, reopened rather than duplicated.
          title="seams broken against vLLM $REF"
          {
            echo "The static seam check reports a broken **required** seam against \`$REF\`."
            echo
            echo "The pinned vLLM is unaffected. This is the early warning that bumping it needs work."
            echo
            echo '```'
            cat /tmp/seams.txt 2>/dev/null || echo "(no output; the clone or the check itself failed)"
            echo '```'
            echo
            echo "Reproduce locally:"
            echo
            echo '```bash'
            echo "git clone --depth 1 --branch $REF https://github.com/vllm-project/vllm.git /tmp/vllm"
            echo "surgeon seams --source /tmp/vllm"
            echo '```'
          } > /tmp/issue.md
          n=$(gh issue list --state all --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue reopen "$n" || true
            gh issue comment "$n" --body-file /tmp/issue.md
          else
            gh issue create --title "$title" --body-file /tmp/issue.md
          fi
          exit 1
