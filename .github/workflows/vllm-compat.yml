# Does this package still hold against the vLLM that shipped today?
#
# vLLM guarantees exactly one thing for out-of-tree code -- that
# ModelRegistry.register_model keeps working. Everything in compat/seams.py is
# borrowed, not owed, so the useful question is not "did it break" but "which
# name moved, and when". This asks that on every vLLM release and on a weekly
# tick, and it asks it the cheap way: a shallow clone plus the static seam
# checker, no install, no GPU, no CUDA wheels.
#
# A required seam breaking is news, not an emergency: the pinned version keeps
# working. So the failure opens (or updates) one issue naming the symbol rather
# than quietly going red.
name: vllm-compat

on:
  schedule:
    # Weekly. vLLM releases roughly fortnightly; this catches a release within
    # days without burning a run a day on an unchanged upstream.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "vLLM ref to check (default: latest release tag)"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  seams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (offline half only -- the checker needs no vLLM)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      - name: Resolve the vLLM ref to check
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${{ github.event.inputs.ref }}"
          if [ -z "$ref" ]; then
            ref=$(gh api repos/vllm-project/vllm/releases/latest --jq .tag_name)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "checking against vLLM $ref"

      - name: Clone that ref
        run: |
          git clone --depth 1 --branch "${{ steps.ref.outputs.ref }}" \
            https://github.com/vllm-project/vllm.git /tmp/vllm

      - name: Check the seams
        id: check
        run: |
          set +e
          surgeon seams --source /tmp/vllm | tee /tmp/seams.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Report a broken seam
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${{ steps.ref.outputs.ref }}"
          title="seams broken against vLLM $ref"
          # One issue per upstream ref, reopened rather than duplicated.
          existing=$(gh issue list --state all --search "$title in:title" \
            --json number --jq '.[0].number')
          body=$(printf 'Static seam check against \x60%s\x60 reports a broken **required** seam.\n\nThe pinned version is unaffected -- this is the early warning that a bump would need work.\n\n\x60\x60\x60\n%s\n\x60\x60\x60\n\nRun locally with:\n\n\x60\x60\x60bash\nsurgeon seams --source /path/to/vllm\n\x60\x60\x60\n' "$ref" "$(cat /tmp/seams.txt)")
          if [ -n "$existing" ]; then
            gh issue reopen "$existing" 2>/dev/null || true
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label upstream || \
              gh issue create --title "$title" --body "$body"
          fi
          exit 1
