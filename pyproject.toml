[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-moe-surgeon"
version = "0.1.0.dev0"
description = "An NVMe expert tier for domain-specialised MoE vLLM deployments, with offline expert pruning and merging where a model supports it"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "Yasin YAMAN", email = "yasnyaman@gmail.com" }]
keywords = ["vllm", "mixture-of-experts", "moe", "inference", "offloading", "nvme"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Deliberately minimal. The offline surgery pipeline must stay importable
# without vLLM installed. vLLM is an extra.
dependencies = [
    "torch",
    "safetensors",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/yasinyaman/moe-surgeon"
Repository = "https://github.com/yasinyaman/moe-surgeon"
Issues = "https://github.com/yasinyaman/moe-surgeon/issues"

[project.optional-dependencies]
# The runtime half: telemetry collection and the serve-time disk tier.
# Pinned narrowly on purpose. Widening the pin is a decision, not a default:
# tests/test_seams.py is what tells you whether a wider pin is safe.
# 0.26.1 was never released upstream -- the tags go 0.26.0 -> 0.26.1rc0 -> 0.27.0 --
# so the floor named a version nobody can install. 0.26.0 is the oldest release the
# seam check passes against.
runtime = ["vllm>=0.26.0,<0.27"]
server = ["fastapi", "uvicorn", "pydantic>=2", "huggingface_hub"]
# fastapi+httpx so the TestClient tests run in CI (bare fastapi does not pull
# httpx); scipy so the greedy alignment fallback is checked against the real
# Hungarian solver instead of against itself.
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "fastapi", "httpx", "scipy"]

[project.scripts]
surgeon = "vllm_moe_surgeon.cli:main"

# Loaded by vLLM in every process that touches the model: EngineArgs.__post_init__,
# EngineCore.__init__, and WorkerWrapperBase.init_worker. The callable must be
# re-entrant -- vLLM makes no promise about how many times it runs.
[project.entry-points."vllm.general_plugins"]
moe_surgeon = "vllm_moe_surgeon.plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vllm_moe_surgeon = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These files are verbatim lifts from the in-tree prototype: only their import
# lines were rewritten. They are kept byte-comparable against
# repos/vllm on branch disk-tier-proto so the lift stays auditable and so
# upstream fixes can still be diffed in. Reformatting them to satisfy rules
# vLLM's own ruff config does not select would forfeit that for nothing.
# Delete an entry here once the corresponding file is genuinely ours.
"src/vllm_moe_surgeon/store/*.py" = ["B007", "B905"]
"tests/test_expert_cache.py" = ["B905", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# So the suite runs from a bare checkout without an editable install.
pythonpath = ["src"]
# pytest-randomly's teardown reseed goes through thinc's fix_random_seed, which
# rejects the seed it is handed ("Seed must be between 0 and 2**32 - 1"). Both
# arrive from the ambient site-packages, not from this project, and the failure
# is in teardown so it masks real results. The suite seeds explicitly via
# tests/_support.set_random_seed, so random ordering buys us nothing here.
addopts = ["-p", "no:randomly"]
markers = [
    "needs_vllm: requires vLLM importable",
    "needs_cuda: requires a CUDA device",
]
